<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Royal Vegas — Бонусная Супер-Игра</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Playfair+Display:wght@700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #f5d76e;
  --gold-deep: #b8860b;
  --gold-light: #fff2b2;
  --felt: #0d3b2e;
  --felt-dark: #06231b;
  --neon: #ff2d75;
  --neon-blue: #00e5ff;
  --bonus: #9b30ff;
  --bonus-light: #d8a0ff;
}

body {
  background:
    radial-gradient(circle at 50% 0%, #3a1020 0%, transparent 55%),
    radial-gradient(circle at 0% 100%, #0a2a1f 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, #1a0a30 0%, transparent 50%),
    linear-gradient(160deg, #0a0610 0%, #150a1c 50%, #0a1410 100%);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  font-family: 'Cinzel', 'Segoe UI', serif;
  padding: 20px; overflow-x: hidden; position: relative;
}

body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  filter: blur(120px); opacity: 0.35; pointer-events: none; z-index: 0;
  animation: floatLight 12s ease-in-out infinite alternate;
}
body::before { width: 380px; height: 380px; background: var(--neon); top: -100px; left: -80px; }
body::after  { width: 420px; height: 420px; background: var(--neon-blue); bottom: -140px; right: -100px; animation-delay: -6s; }
@keyframes floatLight {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(40px,60px) scale(1.15); }
}

.stars {
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
    radial-gradient(1px 1px at 70% 60%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, #fff9, transparent),
    radial-gradient(1px 1px at 85% 20%, #fff5, transparent),
    radial-gradient(1px 1px at 55% 45%, #fff7, transparent);
  background-size: 200px 200px;
  opacity: 0.6; z-index: 0; pointer-events: none;
  animation: twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: 0.4; } to { opacity: 0.8; } }

.casino {
  position: relative; z-index: 2;
  max-width: 640px; width: 100%;
  background: linear-gradient(180deg, #2a0e18 0%, #1a0710 40%, #120510 100%);
  border-radius: 32px; padding: 32px 26px 30px;
  box-shadow:
    0 0 0 2px var(--gold-deep), 0 0 0 6px #0a0408, 0 0 0 8px var(--gold),
    0 25px 60px -10px rgba(0,0,0,0.85), 0 0 80px rgba(255,45,117,0.15),
    inset 0 1px 0 rgba(255,255,255,0.15);
  overflow: hidden;
}
.casino::before {
  content: ''; position: absolute; inset: 10px; border-radius: 24px;
  border: 1px solid rgba(245,215,110,0.35); pointer-events: none;
  background: radial-gradient(circle at 50% 0%, rgba(255,45,117,0.08), transparent 60%);
}
.casino::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 220px; height: 4px;
  background: linear-gradient(90deg, transparent, var(--gold-light), var(--gold), var(--gold-light), transparent);
  border-radius: 0 0 8px 8px;
  box-shadow: 0 0 20px 4px rgba(245,215,110,0.6);
}

h1 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 5.5vw, 2.4rem);
  font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
  background: linear-gradient(180deg, #fff8d6 0%, var(--gold) 40%, var(--gold-deep) 75%, #6b4a0a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 14px rgba(245,215,110,0.45));
  margin-bottom: 22px;
  display: flex; justify-content: center; align-items: center; gap: 12px;
}
h1 .icon {
  font-size: 1.4em;
  filter: drop-shadow(0 0 10px var(--neon)) drop-shadow(0 3px 2px black);
  animation: pulseIcon 2.2s ease-in-out infinite;
}
@keyframes pulseIcon {
  0%,100% { transform: scale(1) rotate(0); }
  50%     { transform: scale(1.12) rotate(-6deg); }
}

.balance-panel {
  background: linear-gradient(180deg, #1a0a14 0%, #0d050a 100%);
  border-radius: 18px; padding: 14px 22px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--gold-deep);
  box-shadow: inset 0 2px 10px black, inset 0 -1px 0 rgba(245,215,110,0.2), 0 6px 20px rgba(0,0,0,0.6);
  margin-bottom: 24px;
}
.balance-label {
  font-size: 0.95rem; letter-spacing: 2px; color: var(--gold);
  display: flex; align-items: center; gap: 8px;
  text-shadow: 0 0 8px rgba(245,215,110,0.5);
}
.balance-amount {
  background: linear-gradient(180deg, #2a1a08 0%, #150b04 100%);
  padding: 8px 24px; border-radius: 40px;
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem; font-weight: 900; color: var(--gold-light);
  text-shadow: 0 0 16px var(--gold), 0 2px 0 black;
  border: 1px solid var(--gold-deep);
  box-shadow: inset 0 -3px 6px black, inset 0 1px 0 rgba(255,242,178,0.25), 0 3px 0 #0a0500;
  letter-spacing: 1px; min-width: 130px; text-align: center;
  transition: all 0.25s;
}
.balance-amount.flash { animation: balanceFlash 0.5s ease; }
@keyframes balanceFlash {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.1); color: #b5ff9b; text-shadow: 0 0 24px #7aff4c; }
  100% { transform: scale(1); }
}

.game-area {
  position: relative;
  background: radial-gradient(ellipse at 50% 0%, #155a44 0%, var(--felt) 45%, var(--felt-dark) 100%);
  border-radius: 22px; padding: 26px 16px 22px;
  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.8), inset 0 4px 12px rgba(0,0,0,0.9),
    0 0 0 1px rgba(245,215,110,0.4), 0 0 0 4px #0a0408, 0 8px 20px black;
  margin-bottom: 24px; overflow: hidden;
}
.game-area::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
  pointer-events: none;
}

.dice-display {
  display: flex; justify-content: center; align-items: center;
  gap: clamp(10px,3vw,22px); margin-bottom: 18px; flex-wrap: wrap;
  position: relative; z-index: 1;
}

.number-box {
  background: radial-gradient(circle at 30% 25%, #3a2c14 0%, #1a1206 70%, #0a0602 100%);
  width: clamp(90px,20vw,118px); height: clamp(90px,20vw,118px);
  border-radius: 22px;
  display: flex; justify-content: center; align-items: center;
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem,9vw,4.5rem); font-weight: 900;
  color: var(--gold-light);
  text-shadow: 0 0 22px rgba(245,215,110,0.85), 0 3px 0 #43340e, 0 0 40px rgba(245,215,110,0.4);
  box-shadow:
    0 0 0 2px var(--gold-deep), 0 0 0 5px #0a0408, 0 8px 0 #0a0500,
    0 12px 20px rgba(0,0,0,0.85), inset 0 3px 12px rgba(0,0,0,0.9),
    inset 0 -2px 0 rgba(255,242,178,0.15);
  border-top: 1px solid rgba(255,242,178,0.4);
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  line-height: 1; position: relative;
}
.number-box::after {
  content: ''; position: absolute; inset: 6px; border-radius: 16px;
  border: 1px solid rgba(245,215,110,0.2); pointer-events: none;
}
.number-box.win {
  color: #c8ffb0;
  text-shadow: 0 0 26px #7aff4c, 0 0 50px #7aff4c, 0 3px 0 #1f4a0e;
  box-shadow:
    0 0 0 2px #4caf50, 0 0 0 5px #0a0408, 0 8px 0 #0a0500,
    0 12px 20px rgba(0,0,0,0.85), 0 0 30px rgba(122,255,76,0.6),
    inset 0 3px 12px rgba(0,0,0,0.9);
  animation: winPop 0.55s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes winPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.number-box.lose {
  color: #ff9e9e;
  text-shadow: 0 0 22px #ff4d4d, 0 3px 0 #4a0e0e;
  box-shadow:
    0 0 0 2px #a03030, 0 0 0 5px #0a0408, 0 8px 0 #0a0500,
    0 12px 20px rgba(0,0,0,0.85), inset 0 3px 12px rgba(0,0,0,0.9);
  animation: loseShake 0.45s ease;
}
@keyframes loseShake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
}

.vs-badge {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.2rem,3.5vw,1.8rem); font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 12px var(--neon), 0 2px 4px black;
  background: linear-gradient(180deg, #2a0e18, #120510);
  padding: 10px 14px; border-radius: 50px;
  box-shadow: 0 0 0 1px var(--gold-deep), 0 0 16px rgba(255,45,117,0.5), inset 0 -2px 4px black;
  letter-spacing: 1px;
}

.result-message {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: clamp(1rem,3.2vw,1.25rem); font-weight: 700;
  min-height: 3rem; padding: 10px 6px 0;
  letter-spacing: 0.5px; color: var(--gold-light);
  text-shadow: 0 2px 6px black, 0 0 12px rgba(245,215,110,0.4);
  position: relative; z-index: 1; transition: color 0.3s;
}

/* ============ БОНУС-ПАНЕЛЬ ============ */
.bonus-panel {
  background: linear-gradient(180deg, #1a0a2e 0%, #0d0518 100%);
  border-radius: 16px; padding: 12px 18px;
  margin-bottom: 18px;
  border: 1px solid var(--bonus);
  box-shadow:
    inset 0 2px 10px black,
    0 0 0 1px rgba(155,48,255,0.3),
    0 6px 20px rgba(155,48,255,0.25),
    inset 0 -1px 0 rgba(216,160,255,0.2);
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
  position: relative; overflow: hidden; transition: all 0.3s;
}
.bonus-panel::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(155,48,255,0.15), transparent);
  transform: translateX(-100%);
  animation: bonusShimmer 3s ease-in-out infinite;
}
@keyframes bonusShimmer {
  0%, 100% { transform: translateX(-100%); }
  50%      { transform: translateX(100%); }
}
.bonus-panel.active {
  animation: bonusPulse 0.6s ease;
  box-shadow:
    inset 0 2px 10px black,
    0 0 0 2px var(--bonus-light),
    0 0 30px rgba(155,48,255,0.8),
    0 0 60px rgba(155,48,255,0.4);
}
@keyframes bonusPulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.bonus-info { display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
.bonus-title {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem; font-weight: 800;
  letter-spacing: 2px; color: var(--bonus-light);
  text-shadow: 0 0 10px var(--bonus), 0 1px 2px black;
  display: flex; align-items: center; gap: 6px;
}
.bonus-subtitle { font-size: 0.7rem; color: #b8a0d8; letter-spacing: 0.5px; }

.bonus-indicator { display: flex; gap: 4px; position: relative; z-index: 1; align-items: center; }
.bonus-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #2a1a3e; border: 1px solid #4a2a6e;
  box-shadow: inset 0 2px 3px black; transition: all 0.3s;
}
.bonus-dot.filled {
  background: radial-gradient(circle at 30% 30%, #e0b0ff, var(--bonus) 60%, #5a0090);
  box-shadow: 0 0 10px var(--bonus), 0 0 20px var(--bonus-light), inset 0 -1px 0 rgba(255,255,255,0.3);
  animation: dotPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes dotPop {
  0%   { transform: scale(0); }
  70%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.bonus-btn {
  background: linear-gradient(180deg, var(--bonus-light) 0%, var(--bonus) 50%, #5a0090 100%);
  border: none; border-bottom: 4px solid #3a0060;
  color: #fff; font-family: 'Playfair Display', serif;
  font-size: 0.85rem; font-weight: 900;
  padding: 10px 16px; border-radius: 10px;
  text-transform: uppercase; letter-spacing: 1.5px;
  cursor: pointer; transition: all 0.12s ease;
  text-shadow: 0 1px 2px black;
  box-shadow: 0 0 12px rgba(155,48,255,0.6), 0 4px 0 #3a0060;
  position: relative; z-index: 1; white-space: nowrap;
}
.bonus-btn:hover:not(:disabled) { filter: brightness(1.15); }
.bonus-btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 1px; box-shadow: 0 0 12px rgba(155,48,255,0.6); }
.bonus-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); box-shadow: none; }
.bonus-btn.ready { animation: bonusBtnGlow 1s ease-in-out infinite alternate; }
@keyframes bonusBtnGlow {
  from { box-shadow: 0 0 12px rgba(155,48,255,0.6), 0 4px 0 #3a0060; }
  to   { box-shadow: 0 0 30px rgba(216,160,255,0.9), 0 0 60px rgba(155,48,255,0.6), 0 4px 0 #3a0060; }
}

.guess-controls { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin-bottom: 20px; }
.guess-btn {
  background: linear-gradient(180deg, #3a2c14 0%, #1a1206 60%, #0d0803 100%);
  border: none; border-top: 1px solid rgba(245,215,110,0.4);
  border-bottom: 5px solid #0a0500;
  color: var(--gold-light);
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.3rem,4vw,1.7rem); font-weight: 900;
  height: clamp(58px,12vw,74px); border-radius: 14px;
  cursor: pointer; transition: all 0.12s ease;
  box-shadow: 0 0 0 1px var(--gold-deep), 0 4px 10px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,242,178,0.2);
  text-shadow: 0 1px 0 black;
  display: flex; justify-content: center; align-items: center;
  user-select: none; position: relative; overflow: hidden;
}
.guess-btn::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(245,215,110,0.15), transparent 70%);
  opacity: 0; transition: opacity 0.2s;
}
.guess-btn:hover::before { opacity: 1; }
.guess-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 1px var(--gold), 0 6px 14px rgba(0,0,0,0.8), 0 0 20px rgba(245,215,110,0.35);
}
.guess-btn:active {
  transform: translateY(3px); border-bottom-width: 2px;
  box-shadow: 0 0 0 1px var(--gold-deep), 0 1px 3px rgba(0,0,0,0.7);
}
.guess-btn.selected {
  background: linear-gradient(180deg, #ffe9a0 0%, var(--gold) 40%, var(--gold-deep) 100%);
  color: #1a0e00; text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  border-top-color: #fffbe0; border-bottom-color: #6b4a0a;
  box-shadow: 0 0 0 2px var(--gold-light), 0 0 24px rgba(245,215,110,0.85), 0 4px 10px rgba(0,0,0,0.7);
  transform: translateY(2px);
}
.guess-btn:disabled { opacity: 0.4; transform: none; pointer-events: none; filter: grayscale(0.5); }

.bet-section { display: flex; align-items: stretch; gap: 12px; flex-wrap: wrap; }
.bet-control {
  flex: 1 1 200px; display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, #1a0a14 0%, #0d050a 100%);
  padding: 8px 8px 8px 16px; border-radius: 16px;
  border: 1px solid var(--gold-deep);
  box-shadow: inset 0 2px 8px black, 0 4px 12px rgba(0,0,0,0.6);
}
.bet-control label {
  color: var(--gold); font-family: 'Cinzel', serif; font-weight: 700;
  font-size: 0.8rem; letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(245,215,110,0.4); white-space: nowrap;
}
.bet-amount {
  flex: 1; min-width: 0;
  background: #050203; border: 1px solid #3a2c14;
  border-radius: 10px; padding: 12px 10px;
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem; font-weight: 900; color: var(--gold-light);
  text-align: center;
  text-shadow: 0 0 10px rgba(245,215,110,0.5);
  box-shadow: inset 0 3px 8px black;
  transition: all 0.2s; width: 100%;
  -moz-appearance: textfield;
}
.bet-amount::-webkit-outer-spin-button,
.bet-amount::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.bet-amount:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 3px 8px black, 0 0 14px rgba(245,215,110,0.5); }
.bet-amount:disabled { opacity: 0.6; }

.spin-btn {
  flex: 0 1 auto;
  background: linear-gradient(180deg, #ffe9a0 0%, var(--gold) 40%, var(--gold-deep) 100%);
  border: none; border-bottom: 6px solid #5e400e;
  color: #1a0e00;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem,3vw,1.4rem); font-weight: 900;
  padding: 16px 28px; border-radius: 16px;
  text-transform: uppercase; letter-spacing: 2px;
  box-shadow: 0 8px 0 #4f3a12, 0 10px 20px black, 0 0 24px rgba(245,215,110,0.4);
  cursor: pointer; transition: all 0.08s linear;
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 160px;
}
.spin-btn:hover:not(:disabled) { filter: brightness(1.08); }
.spin-btn:active:not(:disabled) { transform: translateY(6px); border-bottom-width: 2px; box-shadow: 0 2px 0 #4f3a12, 0 8px 14px black; }
.spin-btn:disabled { opacity: 0.5; transform: translateY(4px); box-shadow: 0 4px 0 #4f3a12; border-bottom-width: 2px; pointer-events: none; }

.info-bar {
  display: flex; justify-content: space-between; margin-top: 18px;
  font-size: 0.8rem; color: #aa9e78; padding: 0 6px;
  font-weight: 500; letter-spacing: 0.4px; gap: 8px; flex-wrap: wrap;
}
.info-bar span {
  background: #0b1a23; padding: 6px 12px; border-radius: 30px;
  box-shadow: inset 0 1px 4px black; border: 1px solid #3f4e58;
}

/* ==================== ЛЕЩ (проигрыш) ==================== */
.slap-hand {
  position: fixed; top: 50%; left: -300px;
  width: 300px; height: 240px;
  z-index: 99999; pointer-events: none; opacity: 0;
  transform-origin: 100% 50%;
  filter: drop-shadow(0 0 24px rgba(255,60,60,0.9)) drop-shadow(0 6px 12px rgba(0,0,0,0.7));
}
.slap-hand svg { width: 100%; height: 100%; display: block; }
.slap-hand.active { animation: slapFly 0.9s cubic-bezier(0.5,0,0.4,1) forwards; }
@keyframes slapFly {
  0%   { left: -300px; top: 40%; opacity: 0; transform: rotate(-30deg) scale(0.85); }
  30%  { opacity: 1; }
  55%  { left: 38%; top: 42%; transform: rotate(12deg) scale(1.15); }
  63%  { left: 48%; top: 43%; transform: rotate(18deg) scale(1.22); }
  72%  { left: 54%; top: 44%; transform: rotate(22deg) scale(1.15); }
  100% { left: 115vw; top: 38%; opacity: 0; transform: rotate(38deg) scale(0.85); }
}

.slap-flash {
  position: fixed; inset: 0;
  background: radial-gradient(circle at center, rgba(255,40,40,0.7) 0%, rgba(255,0,0,0.25) 30%, transparent 70%);
  z-index: 99998; pointer-events: none; opacity: 0;
}
.slap-flash.active { animation: slapFlashAnim 0.65s ease-out forwards; }
@keyframes slapFlashAnim { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }

.shake-screen { animation: shakeHard 0.55s ease-in-out; }
@keyframes shakeHard {
  0%,100% { transform: translate(0,0) rotate(0); }
  10%     { transform: translate(-14px,10px) rotate(-1.2deg); }
  20%     { transform: translate(12px,-12px) rotate(1.2deg); }
  30%     { transform: translate(-12px,-8px) rotate(-1deg); }
  40%     { transform: translate(14px,8px) rotate(1deg); }
  50%     { transform: translate(-10px,12px) rotate(-0.6deg); }
  60%     { transform: translate(10px,-10px) rotate(0.6deg); }
  70%     { transform: translate(-8px,6px) rotate(-0.5deg); }
  80%     { transform: translate(6px,-6px) rotate(0.4deg); }
  90%     { transform: translate(-3px,3px) rotate(0); }
}

.slap-text {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 14vw, 7rem); font-weight: 900;
  color: #fff;
  text-shadow: 0 0 20px #ff2d2d, 0 0 40px #ff0000, 0 6px 0 #8b0000, 0 8px 20px black;
  z-index: 100000; pointer-events: none; opacity: 0;
  letter-spacing: 6px; white-space: nowrap;
}
.slap-text.active { animation: slapTextAnim 1.15s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes slapTextAnim {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0) rotate(-25deg); }
  30%  { opacity: 1; transform: translate(-50%,-50%) scale(1.4) rotate(6deg); }
  50%  { transform: translate(-50%,-50%) scale(1) rotate(-4deg); }
  70%  { transform: translate(-50%,-50%) scale(1.08) rotate(2deg); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.8) rotate(0); }
}

/* ==================== ВЫИГРЫШ ==================== */
.gold-burst { position: fixed; inset: 0; pointer-events: none; z-index: 99997; overflow: hidden; }
.gold-particle {
  position: absolute; top: 50%; left: 50%;
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff8d6, #f5d76e 40%, #b8860b 100%);
  box-shadow: 0 0 12px 3px rgba(245,215,110,0.9), 0 0 24px rgba(255,215,0,0.6);
  will-change: transform, opacity;
}
.gold-sun {
  position: fixed; top: 50%; left: 50%;
  width: 100px; height: 100px; border-radius: 50%;
  transform: translate(-50%,-50%) scale(0);
  background: radial-gradient(circle, #fff8d6 0%, #f5d76e 30%, #ffae00 50%, transparent 70%);
  z-index: 99996; pointer-events: none; opacity: 0;
}
.gold-sun.active { animation: goldSunBurst 1.1s ease-out forwards; }
@keyframes goldSunBurst {
  0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
  50%  { transform: translate(-50%,-50%) scale(9); opacity: 0.9; }
  100% { transform: translate(-50%,-50%) scale(22); opacity: 0; }
}

.mega-win-text {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0) rotate(-10deg);
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 9vw, 5rem); font-weight: 900;
  text-align: center; z-index: 100000; pointer-events: none;
  opacity: 0; white-space: nowrap; letter-spacing: 4px;
  background: linear-gradient(180deg, #fffbe0 0%, #ffe066 30%, #f5d76e 55%, #b8860b 80%, #6b4a0a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 20px #fff3a0) drop-shadow(0 0 40px #ffbf00) drop-shadow(0 6px 0 #4a3000) drop-shadow(0 10px 30px black);
}
.mega-win-text.active { animation: megaWinAnim 2s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes megaWinAnim {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0) rotate(-20deg); }
  20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.4) rotate(8deg); }
  35%  { transform: translate(-50%,-50%) scale(1) rotate(-5deg); }
  50%  { transform: translate(-50%,-50%) scale(1.2) rotate(3deg); }
  65%  { transform: translate(-50%,-50%) scale(1) rotate(-2deg); }
  80%  { transform: translate(-50%,-50%) scale(1.05) rotate(1deg); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6) rotate(0); }
}

.win-flash {
  position: fixed; inset: 0; z-index: 99994;
  background: radial-gradient(circle at center, rgba(255,255,200,0.9) 0%, rgba(255,215,0,0.4) 30%, transparent 70%);
  pointer-events: none; opacity: 0;
}
.win-flash.active { animation: winFlashAnim 1.2s ease-out forwards; }
@keyframes winFlashAnim { 0% { opacity: 0; } 8% { opacity: 1; } 40% { opacity: 0.4; } 100% { opacity: 0; } }

@media (max-width: 480px) {
  .casino { padding: 20px 14px; }
  h1 { letter-spacing: 2px; }
  .bet-section { flex-direction: column; }
  .spin-btn { width: 100%; }
  .slap-hand { width: 200px; height: 160px; }
}
</style>
</head>
<body>
<div class="stars"></div>

<div class="casino" id="casinoCard">
  <h1><span class="icon">🎲</span> ROYAL VEGAS <span class="icon">🎰</span></h1>

  <div class="balance-panel">
    <div class="balance-label">💰 БАЛАНС</div>
    <div class="balance-amount" id="balanceDisplay">1000</div>
  </div>

  <div class="game-area">
    <div class="dice-display">
      <div class="number-box" id="playerNumber">?</div>
      <div class="vs-badge">VS</div>
      <div class="number-box" id="casinoNumber">?</div>
    </div>
    <div class="result-message" id="resultMessage">Выберите число и сделайте ставку</div>
  </div>

  <div class="bonus-panel" id="bonusPanel">
    <div class="bonus-info">
      <div class="bonus-title">✨ БОНУСНАЯ ИГРА</div>
      <div class="bonus-subtitle">Собери 3 искры — активируй джекпот</div>
    </div>
    <div class="bonus-indicator" id="bonusDots">
      <div class="bonus-dot"></div>
      <div class="bonus-dot"></div>
      <div class="bonus-dot"></div>
    </div>
    <button class="bonus-btn" id="bonusBtn" disabled>СУПЕР-ИГРА</button>
  </div>

  <div class="guess-controls" id="guessButtons">
    <button class="guess-btn" data-guess="1">1</button>
    <button class="guess-btn" data-guess="2">2</button>
    <button class="guess-btn" data-guess="3">3</button>
    <button class="guess-btn" data-guess="4">4</button>
    <button class="guess-btn" data-guess="5">5</button>
    <button class="guess-btn" data-guess="6">6</button>
  </div>

  <div class="bet-section">
    <div class="bet-control">
      <label>СТАВКА</label>
      <input type="number" id="betInput" class="bet-amount" value="100" min="10" max="10000" step="10">
    </div>
    <button class="spin-btn" id="spinBtn">🎲 КРУТИТЬ</button>
  </div>

  <div class="info-bar">
    <span>🎯 Угадай 1–6 — выигрыш x2</span>
    <span>💥 3 искры = ДЖЕКПОТ</span>
  </div>
</div>

<script>

(function(){
  // ===== Состояние =====
  let balance = 1000;
  let selectedGuess = null;
  let isSpinning = false;
  let bonusDots = 0;
  let bonusActive = false;

  // ===== DOM =====
  const balanceDisplay = document.getElementById('balanceDisplay');
  const playerNumberEl = document.getElementById('playerNumber');
  const casinoNumberEl = document.getElementById('casinoNumber');
  const resultMessage  = document.getElementById('resultMessage');
  const betInput       = document.getElementById('betInput');
  const spinBtn        = document.getElementById('spinBtn');
  const guessButtons   = document.querySelectorAll('.guess-btn');
  const casinoCard     = document.getElementById('casinoCard');
  const bonusPanel     = document.getElementById('bonusPanel');
  const bonusDotsEl    = document.getElementById('bonusDots');
  const bonusBtn       = document.getElementById('bonusBtn');

  // ===== Утилиты =====
  function updateBalanceUI(){ balanceDisplay.textContent = balance; }
  function flashBalance(){
    balanceDisplay.classList.remove('flash');
    void balanceDisplay.offsetWidth;
    balanceDisplay.classList.add('flash');
  }
  function setSelectedGuess(g){
    selectedGuess = g;
    guessButtons.forEach(b => b.classList.toggle('selected', parseInt(b.dataset.guess,10) === g));
  }
  function clearSelection(){
    selectedGuess = null;
    guessButtons.forEach(b => b.classList.remove('selected'));
  }
  function setControlsDisabled(d){
    betInput.disabled = d;
    spinBtn.disabled = d;
    guessButtons.forEach(b => b.disabled = d);
    bonusBtn.disabled = d || !bonusActive;
    if (!d && bonusActive) bonusBtn.classList.add('ready');
    else bonusBtn.classList.remove('ready');
  }
  function resetBoxStyles(){
    playerNumberEl.classList.remove('win','lose');
    casinoNumberEl.classList.remove('win','lose');
  }

  // ===== Бонус =====
  function updateBonusUI(){
    const dots = bonusDotsEl.querySelectorAll('.bonus-dot');
    dots.forEach((d,i) => d.classList.toggle('filled', i < bonusDots));
    if (bonusDots >= 3){
      bonusActive = true;
      bonusBtn.disabled = false;
      bonusBtn.classList.add('ready');
      bonusPanel.classList.add('active');
      resultMessage.textContent = '✨ БОНУС АКТИВИРОВАН! Жми СУПЕР-ИГРА! ✨';
      resultMessage.style.color = '#d8a0ff';
    } else {
      bonusActive = false;
      bonusBtn.classList.remove('ready');
      bonusBtn.disabled = true;
      bonusPanel.classList.remove('active');
    }
  }
  function addBonusDot(){
    if (bonusDots < 3) bonusDots++;
    updateBonusUI();
  }
  function resetBonus(){
    bonusDots = 0;
    bonusActive = false;
    updateBonusUI();
  }

  // ===== Эффект ЛЕЩ =====
  const slapHandSVG = `
    <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd9b0"/>
          <stop offset="1" stop-color="#e0a070"/>
        </linearGradient>
      </defs>
      <path d="M20,80 Q10,40 40,25 Q70,10 100,25 Q120,35 130,60 L195,80 Q200,95 195,110 L130,130 Q120,155 100,165 Q70,180 40,165 Q10,150 20,80 Z"
            fill="url(#skin)" stroke="#a06030" stroke-width="3"/>
      <path d="M60,50 Q80,60 80,90 M90,45 Q110,60 110,95 M120,50 Q135,65 135,100"
            stroke="#c08050" stroke-width="2" fill="none" opacity="0.6"/>
    </svg>`;

  function triggerSlap(){
    const hand = document.createElement('div');
    hand.className = 'slap-hand';
    hand.innerHTML = slapHandSVG;
    document.body.appendChild(hand);

    const flash = document.createElement('div');
    flash.className = 'slap-flash';
    document.body.appendChild(flash);

    const text = document.createElement('div');
    text.className = 'slap-text';
    text.textContent = 'ЛЕЩ!';
    document.body.appendChild(text);

    casinoCard.classList.add('shake-screen');

    requestAnimationFrame(() => {
      hand.classList.add('active');
      flash.classList.add('active');
      setTimeout(() => text.classList.add('active'), 400);
    });

    setTimeout(() => {
      hand.remove(); flash.remove(); text.remove();
      casinoCard.classList.remove('shake-screen');
    }, 1500);
  }

  // ===== Мощный выигрыш =====
  function triggerMegaWin(){
    const flash = document.createElement('div');
    flash.className = 'win-flash';
    document.body.appendChild(flash);

    const sun = document.createElement('div');
    sun.className = 'gold-sun';
    document.body.appendChild(sun);

    const txt = document.createElement('div');
    txt.className = 'mega-win-text';
    txt.textContent = 'ПОБЕДА!';
    document.body.appendChild(txt);

    const burst = document.createElement('div');
    burst.className = 'gold-burst';
    document.body.appendChild(burst);

    const N = 70;
    for (let i = 0; i < N; i++){
      const p = document.createElement('div');
      p.className = 'gold-particle';
      const angle = Math.random() * Math.PI * 2;
      const distance = 200 + Math.random() * 500;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      const rot = Math.random() * 720 - 360;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(0.3)', opacity: 0 },
        { transform: `translate(calc(-50% + ${tx*0.3}px), calc(-50% + ${ty*0.3}px)) scale(1.2)`, opacity: 1, offset: 0.2 },
        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0.6)`, opacity: 0 }
      ], { duration: 1600, easing: 'cubic-bezier(0.2,0.8,0.4,1)' });
      burst.appendChild(p);
    }

    for (let i = 0; i < 20; i++){
      const ray = document.createElement('div');
      ray.className = 'firework-ray';
      const hue = 40 + Math.random() * 30;
      ray.style.background = `hsl(${hue}, 100%, 65%)`;
      ray.style.color = `hsl(${hue}, 100%, 65%)`;
      document.body.appendChild(ray);
      const angle = (i / 20) * Math.PI * 2;
      const dist = 250 + Math.random() * 250;
      ray.animate([
        { transform: 'translate(-50%,-50%) scale(0)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`, opacity: 0.9, offset: 0.6 },
        { transform: `translate(calc(-50% + ${Math.cos(angle)*dist*1.2}px), calc(-50% + ${Math.sin(angle)*dist*1.2}px)) scale(0)`, opacity: 0 }
      ], { duration: 1400, easing: 'cubic-bezier(0.1,0.7,0.3,1)' });
      setTimeout(() => ray.remove(), 1500);
    }

    requestAnimationFrame(() => {
      sun.classList.add('active');
      flash.classList.add('active');
      txt.classList.add('active');
    });

    casinoCard.classList.add('win-glow');

    setTimeout(() => {
      sun.remove(); flash.remove(); txt.remove(); burst.remove();
      casinoCard.classList.remove('win-glow');
    }, 2300);
  }

  // ===== Основной СПИН =====
  function spin(){
    if (isSpinning) return;
    if (selectedGuess === null){
      resultMessage.textContent = '❌ Сначала выберите число (1-6)!';
      resultMessage.style.color = '#ffb3b3';
      return;
    }
    if (balance < 10){
      resultMessage.textContent = '💔 Недостаточно средств. Обновите страницу.';
      resultMessage.style.color = '#ff8080';
      return;
    }

    let bet = parseInt(betInput.value, 10);
    if (isNaN(bet) || bet < 10) bet = 10;
    if (bet > balance) bet = balance;
    if (bet > 10000) bet = 10000;
    betInput.value = bet;

    isSpinning = true;
    setControlsDisabled(true);
    resetBoxStyles();

    balance -= bet;
    updateBalanceUI();

    resultMessage.style.color = '#ead49b';
    resultMessage.textContent = '🎲 Крутим...';

    const playerRoll = selectedGuess;
    const casinoRoll = Math.floor(Math.random() * 6) + 1;

    let counter = 0;
    const totalFrames = 12;
    const interval = setInterval(() => {
      playerNumberEl.textContent = Math.floor(Math.random() * 6) + 1;
      casinoNumberEl.textContent = Math.floor(Math.random() * 6) + 1;
      counter++;

      if (counter >= totalFrames){
        clearInterval(interval);
        playerNumberEl.textContent = playerRoll;
        casinoNumberEl.textContent = casinoRoll;

        const win = (playerRoll === casinoRoll);
        if (win){
          const winAmount = bet * 2;
          balance += winAmount;
          updateBalanceUI();
          flashBalance();
          playerNumberEl.classList.add('win');
          casinoNumberEl.classList.add('win');
          resultMessage.textContent = `🎉 ПОБЕДА! ${playerRoll} = ${casinoRoll}. +${winAmount} 💰`;
          resultMessage.style.color = '#b5ff9b';
          triggerMegaWin();
          addBonusDot();
        } else {
          playerNumberEl.classList.add('lose');
          casinoNumberEl.classList.add('lose');
          resultMessage.textContent = `😞 Проигрыш. Вы: ${playerRoll}, казино: ${casinoRoll}. -${bet}`;
          resultMessage.style.color = '#ff9e9e';
          triggerSlap();
        }

        isSpinning = false;
        setControlsDisabled(false);

        if (balance < 10){
          spinBtn.disabled = true;
          betInput.disabled = true;
          guessButtons.forEach(b => b.disabled = true);
          resultMessage.textContent += ' ⛔ Недостаточно средств.';
        }
      }
    }, 80);
  }

  // ===== БОНУСНАЯ СУПЕР-ИГРА =====
  function playBonusGame(){
    if (!bonusActive || isSpinning) return;
    isSpinning = true;
    setControlsDisabled(true);

    resultMessage.textContent = '🎰 СУПЕР-ИГРА! Крутим джекпот...';
    resultMessage.style.color = '#d8a0ff';

    // Анимация рулетки
    let ticks = 0;
    const totalTicks = 30;
    const roulette = setInterval(() => {
      playerNumberEl.textContent = Math.floor(Math.random() * 6) + 1;
      casinoNumberEl.textContent = Math.floor(Math.random() * 6) + 1;
      ticks++;
      if (ticks >= totalTicks){
        clearInterval(roulette);

        // Шанс джекпота 1 к 6
        const jackpotRoll = Math.floor(Math.random() * 6) + 1;
        const playerJack = Math.floor(Math.random() * 6) + 1;
        playerNumberEl.textContent = playerJack;
        casinoNumberEl.textContent = jackpotRoll;

        if (playerJack === jackpotRoll){
          // ДЖЕКПОТ!
          const jackpot = Math.max(1000, Math.floor(balance * 0.5));
          balance += jackpot;
          updateBalanceUI();
          flashBalance();
          playerNumberEl.classList.add('win');
          casinoNumberEl.classList.add('win');
          resultMessage.textContent = `💎 ДЖЕКПОТ! +${jackpot} 💰!!!`;
          resultMessage.style.color = '#ffe066';
          triggerMegaWin();
          // Двойной мега-выигрыш
          setTimeout(triggerMegaWin, 600);
        } else {
          // Утешительный приз
          const consolation = 50;
          balance += consolation;
          updateBalanceUI();
          flashBalance();
          playerNumberEl.classList.add('win');
          casinoNumberEl.classList.add('lose');
          resultMessage.textContent = `✨ Утешительный приз: +${consolation} 💰`;
          resultMessage.style.color = '#d8a0ff';
          triggerMegaWin();
        }

        resetBonus();
        isSpinning = false;
        setControlsDisabled(false);

        if (balance < 10){
          spinBtn.disabled = true;
          betInput.disabled = true;
          guessButtons.forEach(b => b.disabled = true);
        }
      }
    }, 70);
  }

  // ===== Обработчики =====
  guessButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (isSpinning) return;
      setSelectedGuess(parseInt(btn.dataset.guess, 10));
      resultMessage.textContent = `Выбрано число: ${selectedGuess}. Жмите КРУТИТЬ.`;
      resultMessage.style.color = '#ead49b';
    });
  });

  spinBtn.addEventListener('click', spin);
  bonusBtn.addEventListener('click', playBonusGame);

  betInput.addEventListener('blur', () => {
    if (isSpinning) return;
    let v = parseInt(betInput.value, 10);
    if (isNaN(v) || v < 10) v = 10;
    if (v > balance) v = balance;
    if (v > 10000) v = 10000;
    betInput.value = v;
  });
  betInput.addEventListener('keydown', e => {
    if (e.key === '-' || e.key === 'e' || e.key === '+') e.preventDefault();
  });

  // ===== Инициализация =====
  resetBoxStyles();
  clearSelection();
  playerNumberEl.textContent = '?';
  casinoNumberEl.textContent = '?';
  updateBalanceUI();
  updateBonusUI();
})();
</script>
</body>
</html>
