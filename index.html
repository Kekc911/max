<!DOCTYPE html>
<html lang="ru">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Коммуникатор</title>
<style>
  :root { --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-light: #64748b; --border: #e2e8f0; --primary: #2563eb; --primary-light: #eff6ff; }
  body.dark { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-light: #94a3b8; --border: #334155; --primary: #3b82f6; --primary-light: #172554; }
  * { box-sizing: border-box; margin: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s; }
  
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  .anim-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .anim-slide { animation: slideUp 0.4s ease-out forwards; }

  #welcomeScreen { position: fixed; inset: 0; background: var(--surface); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: opacity 0.4s; }
  #welcomeScreen.hide { opacity: 0; pointer-events: none; }
  #welcomeScreen h1 { font-size: 28px; margin-bottom: 10px; font-weight: 800; }
  #welcomeScreen p { font-size: 18px; color: var(--text-light); margin-bottom: 30px; font-weight: 500; }
  .welcome-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 350px; }
  .welcome-card { background: var(--bg); border: 2px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .welcome-card:active { transform: scale(0.95); }
  .welcome-card .emoji { font-size: 50px; }
  .welcome-card span { font-size: 16px; font-weight: 700; }

  #mainApp { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; }
  header h1 { font-size: 16px; font-weight: 800; }
  .header-actions { display: flex; gap: 6px; }
  .btn-icon { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text); }
  
  .strip-container { padding: 10px 14px 0; }
  .strip { min-height: 50px; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { background: var(--primary); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  
  .actions { display: flex; gap: 8px; padding: 10px 14px; }
  .actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; color: #fff; cursor: pointer; }
  .btn-speak { background: #059669; } .btn-back { background: #d97706; } .btn-clear { background: #dc2626; }

  .suggestions-container { padding: 0 14px 10px; }
  .suggest-title { font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; text-transform: uppercase; }
  .suggestions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 40px; align-items: center; }
  .suggestions::-webkit-scrollbar { display: none; }
  .suggest-card { background: var(--primary-light); border: 1px solid var(--primary); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .suggest-card span { font-weight: 600; font-size: 13px; color: var(--primary); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-light); font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; padding: 0 14px 14px; overflow-y: auto; align-content: start; }
  .grid.big { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; aspect-ratio: 1/1; border-bottom: 3px solid var(--border); transition: transform 0.1s; }
  .card:active { transform: scale(0.92); }
  .card .emoji { font-size: 32px; line-height: 1; margin-bottom: 6px; }
  .grid.big .card .emoji { font-size: 44px; }
  .card span { font-weight: 600; font-size: 11px; text-align: center; line-height: 1.1; }
  .grid.big .card span { font-size: 13px; }

  .c-needs { border-bottom-color: #f59e0b; } .c-social { border-bottom-color: #ec4899; }
  .c-actions { border-bottom-color: #10b981; } .c-people { border-bottom-color: #eab308; }
  .c-food { border-bottom-color: #3b82f6; } .c-emotions { border-bottom-color: #8b5cf6; }
  .c-places { border-bottom-color: #14b8a6; } .c-things { border-bottom-color: #64748b; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal.active { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--surface); padding: 20px; border-radius: 12px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; transform: translateY(20px); transition: transform 0.2s; max-height: 85vh; overflow-y: auto; }
  .modal.active .modal-box { transform: translateY(0); }
  .modal-box label { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
</style>
</head>
<body>

<div id="welcomeScreen">

    🔊 Нажми, чтобы начать

<div id="mainApp">

<div id="phrasesModal" class="modal">

<div id="settingsModal" class="modal">

    <label>Тон <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="0.7" style="width:100px;"></label>

    <button onclick="document.getElementById('settingsModal').classList.remove('active')" style="padding:12px; border-radius:8px; border:none; background:var(--border); color:var(--text); font-weight:700; font-size:14px; cursor:pointer;">Закрыть</button>
  </div>
</div>

<script>

  // --- ЛОГИКА ПРИВЕТСТВИЯ ---
function startGreeting() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Привет, Максим! Как прошел твой день?");
    u.lang = 'ru-RU';
    u.rate = 1;
    u.pitch = 0.9;
    window.speechSynthesis.speak(u);
  }
}

function selectMood(text, say) {
  speak(say);
  logActivity('Настроение: ' + text);
  
  setTimeout(() => {
    const welcome = document.getElementById('welcomeScreen');
    welcome.classList.add('hide');
    setTimeout(() => { welcome.style.display = 'none'; }, 400);
  }, 1500);
}

// --- СТАТИСТИКА ---
let activityStats = JSON.parse(localStorage.getItem('aac_stats')) || {};
function logActivity(word) {
  if (activityStats[word]) activityStats[word]++;
  else activityStats[word] = 1;
  localStorage.setItem('aac_stats', JSON.stringify(activityStats));
}

function showStats() {
  const sorted = Object.entries(activityStats).sort((a, b) => b[1] - a[1]);
  let statsHtml = '<h3 style="margin-bottom:10px;">Топ слов:</h3>';
  
  if (sorted.length === 0) {
    statsHtml += '<p>Пока нет данных.</p>';
  } else {
    statsHtml += '<ul style="list-style: none; padding: 0;">';
    sorted.slice(0, 10).forEach(([word, count]) => {
      statsHtml += `<li style="padding: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;"><span>${word}</span> <b>${count} раз</b></li>`;
    });
    statsHtml += '</ul>';
  }

  const modal = document.createElement('div');
  modal.className = 'modal active';
  modal.innerHTML = `
    <div class="modal-box">
      <h2 style="text-align:center; font-size:18px; margin-bottom:10px;">Статистика</h2>
      <div>${statsHtml}</div>
      <button onclick="this.parentElement.parentElement.remove()" style="margin-top:15px; padding:12px; border-radius:8px; border:none; background:var(--border); color:var(--text); font-weight:700; cursor:pointer;">Закрыть</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function render() {
  document.getElementById('tabs').innerHTML = Object.keys(catNames).map(key => 
    `<button class="tab ${key === activeCat ? 'active' : ''}" onclick="setCat('${key}')">${catNames[key]}</button>`
  ).join('');

  const gridEl = document.getElementById('grid');
  gridEl.className = `grid ${isLarge ? 'big' : ''}`;
  gridEl.innerHTML = '';
  
  const filteredItems = items.filter(it => it.c === activeCat);
  
  filteredItems.forEach((it, index) => {
    const card = document.createElement('div');
    card.className = `card ${catColors[it.c]} anim-pop`;
    card.style.animationDelay = `${index * 0.02}s`;
    card.innerHTML = `<div class="emoji">${it.e}</div><span>${it.l}</span>`;
    card.onclick = () => addItem(it.l);
    gridEl.appendChild(card);
  });
  
  renderSuggestions();
}

function setCat(cat) { activeCat = cat; render(); }

function addItem(label) {
  const item = items.find(i => i.l === label);
  if (!item) return;
  
  logActivity(item.l); // Записываем в статистику
  
  phrase.push(item);
  updateStrip();
  speak(getWordToSay(item));
  if (item.next && item.next.length > 0) {
    renderSuggestions(item.next);
  } else {
    renderSuggestions([]);
  }
}

function renderSuggestions(words) {
  const container = document.getElementById('suggestions');
  const title = document.getElementById('suggestTitle');
  if (!words || words.length === 0) {
    container.innerHTML = '';
    title.style.display = 'none';
    return;
  }
  title.style.display = 'block';
  container.innerHTML = '';
  words.forEach((wordLabel, idx) => {
    const it = items.find(i => i.l === wordLabel);
    if (!it) return;
    const div = document.createElement('div');
    div.className = 'suggest-card anim-pop';
    div.style.animationDelay = `${idx * 0.05}s`;
    div.innerHTML = `${it.e} <span>${it.l}</span>`;
    div.onclick = () => addItem(it.l);
    container.appendChild(div);
  });
}

function updateStrip() {
  const strip = document.getElementById('strip');
  if (!phrase.length) {
    strip.innerHTML = '<span style="color:var(--text-light); font-weight:500; font-size:13px;">Нажимайте на карточки...</span>';
  } else {
    strip.innerHTML = phrase.map((p, idx) => 
      `<div class="chip anim-pop" onclick="removeItem(${idx})">${p.e} ${p.l} ✕</div>`
    ).join('');
  }
  strip.scrollLeft = strip.scrollWidth;
}

function removeItem(idx) {
  phrase.splice(idx, 1);
  updateStrip();
}

function getWordToSay(item) {
  if (currentLang === 'ru') return item.s;
  if (item.t && item.t[currentLang]) return item.t[currentLang];
  return item.s;
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    let langCode = 'ru-RU';
    if (currentLang === 'en') langCode = 'en-US';
    u.lang = langCode;
    if (selectedVoice) u.voice = selectedVoice;
    u.rate = parseFloat(document.getElementById('rate').value);
    u.pitch = parseFloat(document.getElementById('pitch').value);
    window.speechSynthesis.speak(u);
  }
}

function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices();
  const select = document.getElementById('voiceSelect');
  select.innerHTML = '';
  
  let filtered = voices.filter(v => {
    const lang = v.lang.toLowerCase();
    if (currentLang === 'ru') return lang.includes('ru');
    if (currentLang === 'en') return lang.includes('en');
  });

  const maleNames = ['юрий', 'дмитрий', 'павел', 'артем', 'петр', 'максим', 'иван', 'александр', 'yuri', 'dmitry', 'pavel', 'artem', 'male', 'муж', 'mark', 'daniel', 'alex', 'david', 'thomas', 'james'];
  
  let maleVoices = filtered.filter(v => {
    const name = v.name.toLowerCase();
    return maleNames.some(maleName => name.includes(maleName));
  });

  if (maleVoices.length === 0) maleVoices = filtered; 

  if (maleVoices.length === 0) {
    select.innerHTML = '<option>Голоса не найдены</option>';
    selectedVoice = null;
  } else {
    maleVoices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name + ' (' + v.lang + ')';
      select.appendChild(opt);
    });
    selectedVoice = maleVoices[0];
    select.value = selectedVoice.voiceURI;
  }
}

function setLang(lang) {
  currentLang = lang;
  const btn = document.getElementById('langBtn');
  if (lang === 'ru') btn.innerText = 'RU';
  if (lang === 'en') btn.innerText = 'EN';
  loadVoices();
  if (phrase.length > 0) speak(getWordToSay(phrase[phrase.length - 1]));
}

document.getElementById('speakBtn').onclick = () => {
  if (phrase.length) speak(phrase.map(p => getWordToSay(p)).join(' '));
};
document.getElementById('backBtn').onclick = () => {
  if (phrase.length) { phrase.pop(); updateStrip(); }
};
document.getElementById('clearBtn').onclick = () => {
  phrase = [];
  updateStrip();
  renderSuggestions([]);
};

document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('active');
document.getElementById('themeBtn').onclick = () => document.body.classList.toggle('dark');
document.getElementById('langBtn').onclick = () => {
  if (currentLang === 'ru') setLang('en');
  else setLang('ru');
};

document.getElementById('voiceSelect').onchange = (e) => {
  selectedVoice = voices.find(v => v.voiceURI === e.target.value);
};

document.getElementById('testVoiceBtn').onclick = () => {
  speak(currentLang === 'ru' ? 'Проверка голоса' : 'Voice test');
};

document.getElementById('sizeBtn').onclick = (e) => {
  isLarge = !isLarge;
  e.target.innerText = isLarge ? 'Вкл' : 'Выкл';
  document.getElementById('grid').classList.toggle('big', isLarge);
};

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 300);
}

render();
</script>
</body>
</html>
